// 공통 라이브러리 모듈 (실행 앱 아님)
// 각 기능은 Auto-Configuration 으로 등록되며, 사용하는 서비스에 해당 라이브러리가 있을 때만 켜진다.
//  - Servlet(MVC) 서비스   → 전역 예외 처리, @CurrentUser, @RequireRole
//  - JPA 사용하는 서비스    → JPA Auditing(AuditorAware)
//  - OpenFeign 사용하는 서비스 → 사용자 헤더 전달, ErrorDecoder
//  - Gateway(WebFlux)     → 응답 포맷 / 에러 코드 / 헤더 상수만 사용
apply plugin: 'java-library'

dependencies {
    api 'org.springframework:spring-web'
    api 'com.fasterxml.jackson.core:jackson-databind'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    api 'org.slf4j:slf4j-api'

    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly 'org.springframework:spring-webmvc'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa'
    compileOnly 'org.springframework.cloud:spring-cloud-starter-openfeign'
}
