server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false        # 아래 routes에 적은 경로만 열어둔다 (/internal/** 라우트 없음)
      routes:
        # SA 3.2 Gateway 라우팅 규칙
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
        - id: hub-service
          uri: lb://hub-service
          predicates:
            - Path=/api/v1/hubs/**,/api/v1/hub-routes/**
        - id: company-service
          uri: lb://company-service
          predicates:
            - Path=/api/v1/companies/**,/api/v1/products/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
        - id: delivery-service
          uri: lb://delivery-service
          predicates:
            - Path=/api/v1/deliveries/**
        # Swagger: 각 서비스 /v3/api-docs 를 /{service}/v3/api-docs 로 노출 (SA 3.5 API 문서)
        - id: user-service-docs
          uri: lb://user-service
          predicates:
            - Path=/user-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: hub-service-docs
          uri: lb://hub-service
          predicates:
            - Path=/hub-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: company-service-docs
          uri: lb://company-service
          predicates:
            - Path=/company-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: order-service-docs
          uri: lb://order-service
          predicates:
            - Path=/order-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: delivery-service-docs
          uri: lb://delivery-service
          predicates:
            - Path=/delivery-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

gateway:
  auth:
    role-cache-ttl: 60s          # 권한 재확인 캐시 (권한 변경 반영까지 최대 60초)
    user-lookup-timeout: 3s
    public-paths:                # 인증 없이 통과 (SA 8.3 #3)
      - /api/v1/auth/signup
      - /api/v1/auth/login
      - /swagger-ui.html
      - /swagger-ui/**
      - /webjars/**
      - /v3/api-docs/**
      - /*/v3/api-docs
      - /actuator/health

springdoc:
  swagger-ui:
    urls:
      - name: user-service
        url: /user-service/v3/api-docs
      - name: hub-service
        url: /hub-service/v3/api-docs
      - name: company-service
        url: /company-service/v3/api-docs
      - name: order-service
        url: /order-service/v3/api-docs
      - name: delivery-service
        url: /delivery-service/v3/api-docs
