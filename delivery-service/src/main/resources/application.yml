server:
  port: 8085

spring:
  application:
    name: delivery-service
  datasource:
    url: jdbc:postgresql://localhost:5432/logistics?currentSchema=delivery_schema
    username: delivery_app
    password: delivery_local_pw
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: delivery_schema

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${random.value}
