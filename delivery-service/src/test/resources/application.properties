# delivery 테스트 전용 설정(main의 application.yml과 함께 읽힌다).
# 구간 담당자 배정을 부른 스레드에서 바로 실행해, 주문 확정(I-19) 직후 담당자가 정해진 상태로 검증한다(결정 로그 27·29).
# 비동기 동작은 InProcessAssignmentDispatcherTest가 따로 확인한다.
delivery.assignment.async=false
# 30초 주기 작업이 테스트 중간에 배정을 끼워 넣지 않게 끈다.
delivery.assignment.poll-enabled=false
# 배치 창을 끈다. 동기 모드에서 기다리면 테스트가 느려질 뿐 검증할 것이 없다(배치 창은 InProcessAssignmentDispatcherTest가 본다).
delivery.assignment.batch-window-ms=0
# order가 없는 테스트 환경이다. 배정 결과 알림(I-20)과 확정 유실 안전망(I-21 호출)을 끈다. 알림 호출은 단위 테스트가 본다.
delivery.confirmation.notify-order=false
delivery.confirmation.check.enabled=false
