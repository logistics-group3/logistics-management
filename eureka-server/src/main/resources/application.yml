server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false   # 자기 자신은 레지스트리에 등록하지 않음
    fetch-registry: false
  server:
    enable-self-preservation: false          # 로컬 개발용: 내려간 인스턴스를 빨리 제거
    eviction-interval-timer-in-ms: 10000
    wait-time-in-ms-when-sync-empty: 0
