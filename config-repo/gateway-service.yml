server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            # Note: 주문 생성처럼 내부 호출이 이어지는 요청이 Gateway에서 먼저 끊기지 않게 하위 서비스 read 타임아웃(20초)보다 길게 둔다.
            response-timeout: 60s
          # Note: lb:// 는 Eureka에 등록된 서비스 이름으로 인스턴스를 찾아 라운드로빈으로 분산한다. 인스턴스를 늘려도 Gateway 설정은 바뀌지 않는다.
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/auth/**, /api/v1/users/**
            - id: hub-service
              uri: lb://hub-service
              predicates:
                - Path=/api/v1/hubs/**, /api/v1/hub-routes/**
            - id: company-service
              uri: lb://company-service
              predicates:
                - Path=/api/v1/companies/**, /api/v1/products/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**
            - id: delivery-service
              uri: lb://delivery-service
              predicates:
                - Path=/api/v1/deliveries/**
