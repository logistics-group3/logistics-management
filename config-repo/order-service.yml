server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/logistics?currentSchema=order_schema
    username: order_app
    password: ${ORDER_DB_PASSWORD:order_local_pw}
  cloud:
    openfeign:
      client:
        config:
          order-dm-delivery:
            connectTimeout: 1000
            readTimeout: 2000
          order-dm-user:
            connectTimeout: 1000
            readTimeout: 2000
  jpa:
    properties:
      hibernate:
        default_schema: order_schema
  flyway:
    # 마이그레이션 이력 테이블(flyway_schema_history)과 테이블을 이 서비스 스키마에 만든다
    schemas: order_schema

slack:
  # 비어 있으면 알림을 생략한다. 실제 URL은 비밀값이므로 환경 변수로만 전달한다.
  webhook-url: ${SLACK_WEBHOOK_URL:}
  connect-timeout: 1s
  read-timeout: 2s
  dm:
    enabled: ${SLACK_DM_ENABLED:false}
    bot-token: ${SLACK_BOT_TOKEN:}
    workspace-id: ${SLACK_DM_WORKSPACE_ID:}
    api-base-url: ${SLACK_DM_API_BASE_URL:https://slack.com/api}
    allowed-emails: ${SLACK_DM_ALLOWED_EMAILS:}
    connect-timeout: 1s
    read-timeout: 2s
