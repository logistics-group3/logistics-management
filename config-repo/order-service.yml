server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/logistics?currentSchema=order_schema
    username: order_app
    password: ${ORDER_DB_PASSWORD:order_local_pw}
  cloud:
    openfeign:
      client:
        config:
          # 이슈 #16 시간 예산. 접수 단계(업체·상품 조회 3건)는 요청 스레드에서 실행되므로 호출 1건의 최악을 짧게 묶는다.
          # 최악 1건 = (연결 1초 + 읽기 1.5초) x 최대 3회 + 재시도 간격 = 약 8초. 접수 전체 마감 8초와 합쳐도 브라우저 20초 안이다.
          order-company:
            connectTimeout: 1000
            readTimeout: 1500
          # 처리 단계(별도 스레드). I-09는 delivery 안의 hub·user 조회를 포함하므로 넉넉하되 최악 3 x 13초 안으로 묶는다.
          # 이 시간이 지나면 order가 먼저 끊고 보상(I-13)한다. 늦게 도착한 I-09는 delivery의 종료 표시가 거절한다(이슈 #14).
          order-delivery-create:
            connectTimeout: 1000
            readTimeout: 12000
          # I-13 보상은 OrderService가 최대 3회 직접 반복한다. 호출 1건은 짧게 끊어 보상 전체를 약 12초로 묶는다.
          order-delivery-delete:
            connectTimeout: 1000
            readTimeout: 3000
          # I-17은 보상(I-13) 직후 한 번 확인한다. 실패해도 복구 필요로 남을 뿐이라 짧게 끊어 처리 단계를 늘리지 않는다.
          order-delivery-state:
            connectTimeout: 1000
            readTimeout: 2000
          order-dm-delivery:
            connectTimeout: 1000
            readTimeout: 2000
          order-dm-user:
            connectTimeout: 1000
            readTimeout: 2000
  jpa:
    properties:
      hibernate:
        default_schema: order_schema
  flyway:
    # 마이그레이션 이력 테이블(flyway_schema_history)과 테이블을 이 서비스 스키마에 만든다
    schemas: order_schema

slack:
  # 비어 있으면 알림을 생략한다. 실제 URL은 비밀값이므로 환경 변수로만 전달한다.
  webhook-url: ${SLACK_WEBHOOK_URL:}
  connect-timeout: 1s
  read-timeout: 2s
  dm:
    enabled: ${SLACK_DM_ENABLED:false}
    bot-token: ${SLACK_BOT_TOKEN:}
    workspace-id: ${SLACK_DM_WORKSPACE_ID:}
    api-base-url: ${SLACK_DM_API_BASE_URL:https://slack.com/api}
    allowed-emails: ${SLACK_DM_ALLOWED_EMAILS:}
    connect-timeout: 1s
    read-timeout: 2s
