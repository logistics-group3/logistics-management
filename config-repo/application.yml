# 모든 클라이언트 서비스가 받는 공통 설정. 서비스 전용 값은 {서비스명}.yml에 둔다.
# Note: 환경마다 달라지는 값은 ${ENV:기본값} 자리표시자로 두어 무엇을 바꿀 수 있는지 드러낸다. 자리표시자는 클라이언트 쪽 환경 변수로 풀린다.
# spring.config.import로 받은 Config Server 값은 모듈 application.yml보다는 우선하지만 환경 변수·JVM 시스템 속성보다는 낮다. 그래서 SERVER_PORT 같은 환경 변수로도 덮어쓸 수 있다(2026-10-14 실행으로 확인).

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    # 등록 목록을 받아 오는 주기 (기본 30초). 새로 뜬 서비스를 Gateway·Feign이 빨리 찾게 한다.
    registry-fetch-interval-seconds: 5
  instance:
    instance-id: ${spring.application.name}:${random.value}
    prefer-ip-address: ${EUREKA_PREFER_IP:false}
    # 로컬 개발용 값. 살아 있음을 5초마다 알리고, 15초 동안 신호가 없으면 Eureka가 목록에서 지운다 (기본 30초 / 90초).
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

spring:
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway가 만든다. Hibernate는 Entity와 실제 테이블이 맞는지만 검사하고, 다르면 기동을 멈춘다.
      ddl-auto: validate
  flyway:
    # 서비스 스키마는 infra/postgres/init.sh가 만들어 둔다. 서비스 계정은 스키마를 만들 권한이 없으므로 Flyway가 만들지 않게 한다.
    create-schemas: false
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 20000

management:
  endpoints:
    web:
      exposure:
        # prometheus: Prometheus가 15초마다 가져가는 메트릭(ADR 0018). 서비스 포트는 Compose 네트워크 안에서만 열려 있다.
        include: health,info,prometheus
  metrics:
    tags:
      # 모든 메트릭에 서비스 이름을 붙여 Grafana에서 서비스별로 나눠 본다.
      application: ${spring.application.name}
    distribution:
      # Note: 응답 시간을 구간(bucket)별 개수로도 내보내야 Prometheus가 여러 인스턴스를 합친 p95를 계산할 수 있다.
      # 켜 두면 Micrometer Tracing의 traceId가 bucket에 예시(exemplar)로 붙어 Grafana 그래프에서 Zipkin trace로 넘어갈 수 있다.
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
        # Feign 호출은 common의 FeignMeterFilter가 이 이름으로 바꾼다(라벨 키가 달라 http.client.requests와 섞을 수 없다).
        feign.client.requests: true
  # 분산 추적(ADR 0017). 로컬 개발에서는 모든 요청을 추적한다. 운영처럼 요청이 많으면 TRACING_SAMPLING_PROBABILITY로 낮춘다(Boot 기본값 0.1).
  # Note: 비율은 Gateway가 trace를 시작할 때 정한다. 뒤 서비스는 traceparent의 sampled 플래그를 따르므로 한 요청의 구간이 중간에 끊기지 않는다.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      # IDE로 띄우면 localhost, Compose에서는 docker-compose.yml이 http://zipkin:9411/api/v2/spans를 넣는다.
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

springdoc:
  # 외부 문서에는 서비스 간 내부 API를 싣지 않는다(Gateway에서도 차단된다)
  paths-to-exclude: /internal/**
