server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/logistics?currentSchema=hub_schema
    username: hub_app
    password: ${HUB_DB_PASSWORD:hub_local_pw}
    hikari:
      # 재고 행 락을 3초 넘게 기다리면 DB가 오류를 낸다. 한 행에 요청이 몰려도 대기 요청이 연결 풀을 모두 잡지 않게 한다.
      # Flyway도 같은 풀을 쓰므로 마이그레이션 DDL의 락 대기도 3초로 제한된다. 기존 테이블을 오래 잠그는 마이그레이션을 넣을 때는 이 값을 다시 본다.
      connection-init-sql: SET lock_timeout = '3s'
  jpa:
    properties:
      hibernate:
        default_schema: hub_schema
  flyway:
    # 마이그레이션 이력 테이블(flyway_schema_history)과 테이블을 이 서비스 스키마에 만든다
    schemas: hub_schema
  cloud:
    openfeign:
      client:
        config:
          company-service:
            # 입고 때 company 조회(I-08, 업체 관리자 입고는 I-07도)를 기다린다. 재시도 3회와 곱해져 길어지지 않게 공통 20초보다 줄인다.
            connect-timeout: 1000
            read-timeout: 2000
