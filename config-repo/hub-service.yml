server:
  port: 8082

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/logistics?currentSchema=hub_schema
    username: hub_app
    password: ${HUB_DB_PASSWORD:hub_local_pw}
  jpa:
    properties:
      hibernate:
        default_schema: hub_schema
  flyway:
    # 마이그레이션 이력 테이블(flyway_schema_history)과 테이블을 이 서비스 스키마에 만든다
    schemas: hub_schema

hub:
  cache:
    # 조회 캐시 저장소 none(기본)|local|redis. 성능 측정 항목 B의 조건을 바꿀 때 HUB_CACHE_TYPE으로 준다.
    type: ${HUB_CACHE_TYPE:none}
    ttl: ${HUB_CACHE_TTL:10m}

# Redis는 hub.cache.type=redis일 때만 쓴다. 기본(none)에서 Redis가 없다고 health가 DOWN이 되지 않게 끈다.
management:
  health:
    redis:
      enabled: false
