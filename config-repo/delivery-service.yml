server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/logistics?currentSchema=delivery_schema
    username: delivery_app
    password: ${DELIVERY_DB_PASSWORD:delivery_local_pw}
  jpa:
    properties:
      hibernate:
        default_schema: delivery_schema
  flyway:
    # 마이그레이션 이력 테이블(flyway_schema_history)과 테이블을 이 서비스 스키마에 만든다
    schemas: delivery_schema
  cloud:
    openfeign:
      client:
        config:
          # 결정 로그 26. 공통 기본값(connect 5초, read 20초)은 user가 멈추면 호출 하나가 스레드를 오래 잡는다.
          # 평소 내부 조회는 수십 ms라 read 2초면 충분히 여유 있다. 재시도는 연결 실패만(ConnectFailureRetryer).
          user-service:
            connectTimeout: 1000
            readTimeout: 2000
          hub-service:
            connectTimeout: 1000
            readTimeout: 2000

delivery:
  load-test:
    # 부하 테스트 전용 배송 생성 API(POST /api/v1/deliveries/load-test). 운영에서는 켜지 않는다.
    # 켜기: docker-compose.loadtest.yml을 함께 써서 기동한다(delivery-service/docs/load-test.md).
    enabled: ${DELIVERY_LOAD_TEST_ENABLED:false}

# user 장애 격리(결정 로그 26, delivery-service/docs/fault-isolation.md). 인스턴스 이름은 UserClientAdapter.USER_SERVICE
resilience4j:
  bulkhead:
    instances:
      user-service:
        # 평소 동시 호출 = 초당 호출 × 호출 시간 ≈ 20 × 0.03초 < 1(리틀의 법칙). 10이면 평소에는 거의 차지 않고,
        # user가 멈춰도 user를 기다리는 Tomcat 스레드는 10개를 넘지 않는다(나머지 190개는 조회 등 다른 요청이 쓴다).
        max-concurrent-calls: 10
        # 자리가 없으면 기다리지 않고 바로 거절한다(기다리는 동안 스레드가 묶인다)
        max-wait-duration: 0
  circuitbreaker:
    instances:
      user-service:
        # Note: 처음에는 최근 20건(COUNT_BASED)으로 판단했다. 초당 80번 호출하면 20건은 0.25초 분량이라, 장애가 아닌 순간적인
        # 지연(예열, CPU 경합)에도 서킷이 열려 정상 부하에서 생성 19%가 503이었다(2026-10-19 cap3-40). 최근 10초로 판단한다.
        sliding-window-type: TIME_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        # 느린 호출은 read 타임아웃(2초)에 가까운 1.5초 이상만 센다. 장애(응답 없음)는 타임아웃 실패로 이미 잡힌다
        slow-call-duration-threshold: 1500ms
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # 4xx 거절은 user가 살아 있다는 뜻이라 실패로 세지 않는다
        record-failure-predicate: com.sparta.logistics.delivery.infrastructure.client.UserServiceFailures

