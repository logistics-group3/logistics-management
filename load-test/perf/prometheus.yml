# 성능 마스터 측정용 Prometheus 설정. infra/prometheus/prometheus.yml과 같고 수집 간격만 5초다(load-test/docker-compose.perf.yml).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: logistics-services
    metrics_path: /actuator/prometheus
    eureka_sd_configs:
      - server: http://eureka-server:8761/eureka
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_eureka_app_instance_ip_addr, __meta_eureka_app_instance_metadata_management_port]
        regex: (.+);(.+)
        target_label: __address__
        replacement: $1:$2
      - source_labels: [__meta_eureka_app_name]
        action: lowercase
        target_label: service

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
