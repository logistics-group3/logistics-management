# 성능 마스터 측정용 덧붙임 설정(delivery-service/docs/perf-master.md 3·6절). 팀 공유 docker-compose.yml과 infra/는 바꾸지 않는다.
# 사용: load-test/perf-switch.sh, perf-run.sh가 COMPOSE_FILE에 넣어 쓴다(load-test/perf/lib.sh).
#   COMPOSE_FILE=docker-compose.yml:docker-compose.loadtest.yml:docker-compose.fault.yml:load-test/docker-compose.perf.yml
# Note: 덧붙임 파일의 상대 경로는 이 파일이 아니라 첫 compose 파일(저장소 루트) 기준으로 풀린다.
services:
  postgres:
    # Docker 기본 /dev/shm 64MB로는 구간 294만 건 VACUUM의 병렬 인덱스 정리가 공유 메모리를 못 잡아
    # "could not resize shared memory segment ... No space left on device"로 실패한다(2026-10-22). 병렬 쿼리도 같은 영역을 쓴다.
    shm_size: 256m

  config-server:
    # 버전마다 delivery 설정을 그 커밋의 것으로 바꿔 내준다(F 계열, perf-master.md 2·3절). jar를 다시 빌드하지 않고 폴더만 바꾼다.
    # 폴더는 perf-switch.sh가 HEAD config-repo로 만든다(load-test/perf/lib.sh perf_config_build). 폴더 없이 띄우면 설정이 비어 서비스가 뜨지 않는다.
    environment:
      CONFIG_REPO_LOCATION: file:/perf-config-repo/
    volumes:
      - ./load-test/results/perf/config-repo:/perf-config-repo:ro

  delivery-service:
    # 버전마다 perf-switch.sh가 그 커밋으로 빌드한 이미지를 이 태그에 붙인다. 이 덧붙임으로 script/run.sh를 쓰면
    # 지금 코드로 이 태그를 덮으므로, 측정 중 delivery는 perf-switch.sh로만 바꾼다.
    image: logistics-management-delivery-service:perf-current
    # V3i 측정: 운영에서 order가 하듯 확정(I-19)을 Gateway 없이 직접 보낸다. 이 맥에서만 열린다(perf-master.md 2절)
    ports:
      - "127.0.0.1:18085:8085"

  prometheus:
    # 수집 5초(기본 15초)와 볼륨. 1분 측정에 점이 4개뿐이면 그래프가 안 되고, 컨테이너를 다시 만들면 지표가 사라진다.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./load-test/perf/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - perf-prometheus:/prometheus

  grafana:
    environment:
      GF_RENDERING_SERVER_URL: http://grafana-renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    depends_on:
      grafana-renderer:
        condition: service_started

  # 패널을 PNG로 뽑는다(load-test/perf/capture.sh). 버전 하나를 다 잰 뒤에만 쓴다(측정 중 CPU 간섭).
  grafana-renderer:
    image: grafana/grafana-image-renderer:v5.12.5
    networks: [logistics-net]

volumes:
  perf-prometheus:
