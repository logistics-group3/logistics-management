# 통합 테스트는 Testcontainers PostgreSQL 한 개를 모든 Spring 컨텍스트가 공유한다(common PostgresIntegrationTest).
# 프로퍼티·테스트 설정이 다른 컨텍스트마다 커넥션 풀이 열리므로 기본 풀(10개)로는 컨텍스트가 늘면 max_connections(100)를 넘는다.
# 이 서비스 테스트는 풀을 작게 둔다. 동시성 테스트의 스레드 수는 풀 크기보다 작게 유지한다.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
