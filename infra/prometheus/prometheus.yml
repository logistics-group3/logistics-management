# Prometheus 수집 설정(ADR 0018). docker-compose.yml의 prometheus 컨테이너가 읽는다.
# 수집 대상을 직접 적지 않고 Eureka에서 받아 온다. --scale로 인스턴스를 늘리면 설정을 고치지 않아도 대상이 늘어난다.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: logistics-services
    metrics_path: /actuator/prometheus
    eureka_sd_configs:
      - server: http://eureka-server:8761/eureka
        refresh_interval: 15s
    relabel_configs:
      # 기본 주소는 Eureka에 등록된 IP:서비스 포트다. Gateway처럼 관리 포트를 따로 둔 서비스는
      # Spring Cloud가 Eureka 메타데이터 management.port에 그 포트를 올리므로 그 포트로 바꾼다.
      - source_labels: [__meta_eureka_app_instance_ip_addr, __meta_eureka_app_instance_metadata_management_port]
        regex: (.+);(.+)
        target_label: __address__
        replacement: $1:$2
      # Eureka 앱 이름(USER-SERVICE)을 소문자 service 라벨로 남긴다. 메트릭 자체의 application 라벨과 같은 값이다.
      - source_labels: [__meta_eureka_app_name]
        action: lowercase
        target_label: service

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
