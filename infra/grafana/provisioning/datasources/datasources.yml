# Grafana 데이터소스(ADR 0018). 컨테이너가 뜰 때마다 이 파일로 다시 만든다.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      # 응답 시간 그래프의 점(exemplar)에 붙은 trace_id를 누르면 Zipkin 데이터소스에서 그 trace를 연다.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: zipkin

  - name: Zipkin
    uid: zipkin
    type: zipkin
    access: proxy
    url: http://zipkin:9411
