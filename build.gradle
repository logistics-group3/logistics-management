plugins {
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.sparta'
    version = '0.0.1-SNAPSHOT'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    // Note: 셸 JAVA_HOME(21)과 무관하게 컴파일·테스트·bootRun을 JDK 17로 고정하는 설정. 팀원 간 JDK 차이를 빌드 수준에서 없앤다. (docs/learning/qna/2026-10-13-gradle-toolchain-and-initializr.md)
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    repositories {
        mavenCentral()
    }

    // Note: Boot BOM과 Cloud BOM을 함께 가져와 서로 호환되는 버전 묶음을 쓴다. 각 모듈은 starter에 버전을 적지 않는다.
    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

// Note: JPA를 쓰는 모듈(common + 비즈니스 서비스)에만 QueryDSL Q클래스 생성을 건다. 서비스마다 같은 설정을 반복하지 않게 루트에서 한 번 선언한다.
// common도 포함하는 이유: 서비스 Entity의 Q클래스(QUser)가 상위 클래스의 Q클래스(QBaseEntity)를 상속하기 때문이다.
configure(subprojects.findAll { it.name == 'common' || (it.name.endsWith('-service') && it.name != 'gateway-service') }) {
    dependencies {
        annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jpa"
        annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    }
}
