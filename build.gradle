plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
}

// 버전 고정 (모든 모듈 공통). 바꾸면 전 서비스에 영향 → 팀 합의 후 변경
ext {
    springCloudVersion = '2023.0.3'
    querydslVersion = '5.1.0'
    jjwtVersion = '0.12.6'
    springdocVersion = '2.6.0'
}

// 비즈니스 서비스: common + PostgreSQL + QueryDSL
def businessServices = ['user-service', 'hub-service', 'company-service', 'order-service', 'delivery-service']

allprojects {
    group = 'com.sparta.logistics'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-parameters'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

// 실행 가능한 모듈 (common 제외): bootJar → build/libs/app.jar (Dockerfile에서 사용)
configure(subprojects.findAll { it.name != 'common' }) {
    apply plugin: 'org.springframework.boot'

    tasks.named('bootJar') {
        archiveFileName = 'app.jar'
    }
    tasks.named('jar') {
        enabled = false
    }
}

configure(subprojects.findAll { it.name in businessServices }) {
    dependencies {
        implementation project(':common')
        runtimeOnly 'org.postgresql:postgresql'

        annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"
        annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
        annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    }
}

// Config 클라이언트: config-server(:8888)에서 설정을 받는 서비스 (eureka-server·config-server 제외)
configure(subprojects.findAll { it.name in businessServices + ['gateway-service'] }) {
    dependencies {
        implementation 'org.springframework.cloud:spring-cloud-starter-config'
    }
}
